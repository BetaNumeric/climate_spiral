# Archived template. GitHub only runs workflows in the repository-root .github/workflows.
name: Update GIOMAS sea ice volume

on:
  workflow_dispatch:
  schedule:
    - cron: '31 6 20 * *'

permissions:
  contents: write

concurrency:
  group: giomas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-giomas.txt

      - name: Install processing dependencies
        run: python -m pip install -r scripts/requirements-giomas.txt

      - name: Test GIOMAS processing
        run: |
          python -m unittest discover -s tests -p 'test_giomas*.py'
          node --test tests/giomas-data.test.mjs

      - name: Restore annual source files
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/giomas/
          key: giomas-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: giomas-v1-${{ runner.os }}-${{ github.ref_name }}-

      - name: Download and reduce monthly fields
        run: python -u scripts/update_giomas_data.py

      - name: Test published snapshot
        run: node --test tests/giomas-data.test.mjs tests/readme-video.test.mjs

      - name: Save annual source files
        if: ${{ !cancelled() && steps.cache.outcome == 'success' && hashFiles('.cache/giomas/*.nc.gz') != '' }}
        uses: actions/cache/save@v6
        with:
          path: .cache/giomas/
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Commit validated snapshot
        run: |
          git add data/giomas-sea-ice-volume.json
          if git diff --cached --quiet; then
            echo 'No published data changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update GIOMAS sea ice volume'
          git pull --rebase
          git push
