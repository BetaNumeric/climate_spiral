name: Update climate data

on:
  workflow_dispatch:
  schedule:
    # Fridays at 07:23 UTC.
    - cron: "23 7 * * 5"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download latest source files
        run: |
          curl --fail --location --silent --show-error \
            "https://data.giss.nasa.gov/gistemp/tabledata_v4/GLB.Ts+dSST.txt" \
            --output data/GLB.Ts+dSST.txt

          curl --fail --location --silent --show-error \
            "https://gml.noaa.gov/webdata/ccgg/trends/co2/co2_mm_mlo.txt" \
            --output data/co2_mm_mlo.txt

      - name: Download and validate ocean temperature data
        run: node scripts/update-ocean-data.mjs

      - name: Download and validate land temperature data
        run: node scripts/update-land-data.mjs

      - name: Download and validate sea ice data
        run: node scripts/update-sea-ice-data.mjs

      - name: Download and validate Arctic sea ice volume data
        run: node scripts/update-sea-ice-volume-data.mjs

      - name: Download and validate global methane data
        run: node scripts/update-methane-data.mjs

      - name: Download and validate global sea level data
        run: node scripts/update-sea-level-data.mjs

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Test data handling
        run: npm test

      - name: Commit changed data files
        run: |
          if git diff --quiet -- data/GLB.Ts+dSST.txt data/co2_mm_mlo.txt data/ch4_mm_gl.txt data/global-sea-level.json data/ocean-temperature.json data/land-temperature.json data/sea-ice-north.json data/sea-ice-south.json data/piomas-monthly.txt; then
            echo "No data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/GLB.Ts+dSST.txt data/co2_mm_mlo.txt data/ch4_mm_gl.txt data/global-sea-level.json data/ocean-temperature.json data/land-temperature.json data/sea-ice-north.json data/sea-ice-south.json data/piomas-monthly.txt
          git commit -m "Update climate data"
          git push
