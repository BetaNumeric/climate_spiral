name: Update weather stations

on:
  workflow_dispatch:
  schedule:
    - cron: '41 6 8 * *'

permissions:
  contents: write

concurrency:
  group: weather-station-update
  cancel-in-progress: false

jobs:
  update-stations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test data handling
        run: node --test tests/*.test.mjs

      - name: Download and prepare NOAA station observations
        run: node scripts/update-station-data.mjs

      - name: Commit updated station data
        run: |
          git add data/weather-stations/
          if git diff --cached --quiet; then
            echo "No station data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update NOAA weather station data"
          git pull --rebase
          git push
